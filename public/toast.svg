<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 512 416"
     width="512"
     height="416"
     role="img"
     aria-labelledby="title desc">
  <title id="title">Toast mascot</title>
  <desc id="desc">A warm orange, red, and pink cat-shaped toast mascot with a dark brown outline and face.</desc>

  <defs>
    <linearGradient id="toast-gradient" x1="12%" y1="5%" x2="88%" y2="92%">
      <stop offset="0%" stop-color="#ffad18"/>
      <stop offset="31%" stop-color="#ff4617"/>
      <stop offset="62%" stop-color="#ff1f25"/>
      <stop offset="100%" stop-color="#f94fa8"/>
    </linearGradient>

    <radialGradient id="warm-highlight" cx="18%" cy="8%" r="72%">
      <stop offset="0%" stop-color="#ffd14a" stop-opacity="0.38"/>
      <stop offset="58%" stop-color="#ff8a1b" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="pink-highlight" cx="88%" cy="73%" r="66%">
      <stop offset="0%" stop-color="#ff70c1" stop-opacity="0.34"/>
      <stop offset="70%" stop-color="#ff70c1" stop-opacity="0"/>
    </radialGradient>

    <path id="toast-shape"
          d="M 86 25
             C 124 19, 157 51, 211 61
             C 277 74, 329 55, 392 24
             C 439 1, 487 33, 487 93
             L 487 303
             C 487 362, 449 393, 394 393
             L 119 393
             C 58 393, 25 359, 25 301
             L 25 96
             C 25 54, 48 31, 86 25
             Z"/>

    <clipPath id="toast-clip">
      <use href="#toast-shape"/>
    </clipPath>
  </defs>

  <use href="#toast-shape"
       fill="url(#toast-gradient)"
       stroke="#3a140b"
       stroke-width="16"
       stroke-linejoin="round"/>

  <g clip-path="url(#toast-clip)" pointer-events="none">
    <rect x="17" y="17" width="478" height="384" fill="url(#warm-highlight)"/>
    <rect x="17" y="17" width="478" height="384" fill="url(#pink-highlight)"/>
  </g>

  <g fill="#35130d" stroke="#35130d">
    <circle cx="182" cy="219" r="17" stroke="none"/>
    <circle cx="330" cy="217" r="17" stroke="none"/>
    <path d="M 226 267
             C 242 268, 252 264, 260 250
             C 268 264, 278 268, 294 267"
          fill="none"
          stroke-width="10"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>
</svg>
